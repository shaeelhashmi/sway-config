"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg:#DA007B fg:#ffb3d9)\
$os\
[](bg:#DA007B fg:#ffb3d9)\
$python\
[](bg:#A80061 fg:#ffb3d9)\
$directory\
[](fg:#A80061 bg:#5C0034)\
$git_branch\
$git_status\
[](fg:#A80061 bg:#5C0034)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#3D0022 bg:#2A0017)\
$time\
[ ](fg:#2A0017)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#A80061"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#5C0034"
format = '[[ $symbol $branch ](fg:#ff9ed2 bg:#5C0034)]($style)'

[git_status]
style = "bg:#5C0034"
format = '[[($all_status$ahead_behind )](fg:#ff9ed2 bg:#5C0034)]($style)'

[nodejs]
symbol = ""
style = "bg:#3D0022"
format = '[[ $symbol ($version) ](fg:#ff9ed2 bg:#3D0022)]($style)'

[bun]
symbol = ""
style = "bg:#3D0022"
format = '[[ $symbol ($version) ](fg:#ff9ed2 bg:#3D0022)]($style)'

[rust]
symbol = ""
style = "bg:#3D0022"
format = '[[ $symbol ($version) ](fg:#ff9ed2 bg:#3D0022)]($style)'

[golang]
symbol = ""
style = "bg:#3D0022"
format = '[[ $symbol ($version) ](fg:#ff9ed2 bg:#3D0022)]($style)'

[php]
symbol = ""
style = "bg:#3D0022"
format = '[[ $symbol ($version) ](fg:#ff9ed2 bg:#3D0022)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#2A0017"
format = '[[  $time ](fg:#f5c2dd bg:#2A0017)]($style)'

[os]
style = "fg:#e3e5e5 bg:#DA007B"
format = "[ $symbol ]($style)"
disabled = false

[python]
format = '[ $virtualenv$symbol ]($style)'
style = "bg:#8A0050"
symbol = "🐍 "

[os.symbols]
Ubuntu = "󰕈"